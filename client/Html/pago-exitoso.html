<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso - Sistema de Inscripciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Css/styles.css">
</head>
<body>
    <div class="container mt-5 text-center">
        <div id="status-container">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h1 class="mt-3">Procesando tu pago...</h1>
            <p>Por favor, espera un momento mientras confirmamos tu compra y añadimos los créditos a tu cuenta.</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const statusContainer = document.getElementById('status-container');
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session_id');

            if (!sessionId) {
                statusContainer.innerHTML = '<h1 class="text-danger">Error</h1><p>No se encontró una sesión de pago válida.</p>';
                return;
            }

            try {
                const response = await fetch(`/api/verify-payment?session_id=${sessionId}`);
                const result = await response.json();

                if (!response.ok) throw new Error(result.error || 'Error al verificar el pago.');

                statusContainer.innerHTML = `<h1 class="text-success">¡Pago Exitoso!</h1><p>${result.message}</p><p>Serás redirigido a la página principal en 5 segundos.</p>`;
                setTimeout(() => window.location.href = '/', 5000);

            } catch (error) {
                statusContainer.innerHTML = `<h1 class="text-danger">Error en la Verificación</h1><p>${error.message}</p><p>Por favor, contacta a soporte si el pago fue debitado.</p>`;
            }
        });
    </script>
</body>
</html>
